name: Regenerate POT file (translatable strings)
on:
  schedule:
    - cron: "00 16 * * 5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regenerate-pot-file:
    name: Release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch: ["develop"]
    permissions:
      contents: write

    steps:
        - name: Harden the runner
          uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
          with:
            use-policy-store: true
            api-key: ${{ secrets.GH_FRESHAENGINEERING_STEP_SECURITY_API_KEY }}

        - name: Checkout
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
          with:
            ref: ${{ matrix.branch }}

        - name: Setup mise
          uses: step-security/mise-action@6e96d2ffbc65c037f23c78818f2a339d6cf830f7 # v4.2.4
          with:
            version: '2026.8.12'

        - name: Run script to update POT file
          run: |
            bash ${GITHUB_WORKSPACE}/.github/helper/update_pot_file.sh
          env:
            GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
            BASE_BRANCH: ${{ matrix.branch }}
