name: Semantic Pull Request

on:
  push:
    branches: [ main ]
  pull_request: {}

jobs:
  # This workflow contains a single job called "build"
  semantic:
    name: Validate PR title
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          use-policy-store: true
          api-key: ${{ secrets.GH_FRESHAENGINEERING_STEP_SECURITY_API_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v2

      - uses: zeke/semantic-pull-requests@f4916f442d077624ea7bc24751be187be3c3ac9f # main
