name: Notify Deployment App

on:
  push:
    branches:
      - develop

jobs:
  notify-deployment-app:
    name: Notify deployment app of LMS update
    runs-on: ubuntu-latest
    # Only on the main repo, not forks
    if: github.repository == 'freshaengineering/lms'

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          use-policy-store: true
          api-key: ${{ secrets.GH_FRESHAENGINEERING_STEP_SECURITY_API_KEY }}

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v2.2.1
        with:
            app-id: ${{ secrets.FRESHA_LMS_UPDATE_NOTIFIER_APP_ID }}
            private-key: ${{ secrets.FRESHA_LMS_UPDATE_NOTIFIER_APP_PRIVATE_KEY }}
            owner: surgeventures
            repositories: app-launchpad

      - name: Notify
        uses: step-security/repository-dispatch@1a81ac1c72a4ad222c516293b6adf56b34c4cffd # v4.0.2
        with:
            token: ${{ steps.app-token.outputs.token }}
            repository: freshaengineering/app-launchpad
            event-type: lms-update
            client-payload: '{"lms_commit_sha": "${{ github.sha }}"}'

      - name: Log trigger
        run: |
          echo "Notified downstream app of LMS update for commit: ${{ github.sha }}"
